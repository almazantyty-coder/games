 if(hitter!==0&&pz<PZ&&b.z>=PZ&&ball.v.z>0&&(b.x-pl.x)**2+(b.y-pl.y)**2<.03){const pw=clamp(pv.length()/3.5,0,1);aiWait=[.32,.2,.1][diff];aiErr=(Math.random()-.5)*2*[.26,.17,.09][diff];doHit(0,clamp(pl.x*.35+pv.x*.1,-.62,.62),-(.45+.75*pw),.68-.3*pw)}
 else if(hitter!==1&&pz>-PZ&&b.z<=-PZ&&ball.v.z<0&&(b.x-ai.x)**2+(b.y-ai.y)**2<.03){
  const tx=diff?clamp(-pl.x*.8+(Math.random()-.5)*.5,-.62,.62):(Math.random()-.5)*1.1;doHit(1,tx,.5+Math.random()*.6,[.72,.62,.52][diff]-Math.random()*.06)}}
function bounce(s,p){ripple(p.x,p.z);beep(300+Math.random()*60,.05);if(st!=='play')return;
 if(s===hitter){if(serving&&own===0)own=1;else point(1-hitter,'FAULT')}else{if(opp>=1)point(hitter);else{opp=1;serving=false}}}
function floorHit(){if(st==='play')point(opp>=1?hitter:1-hitter)}
function banner(txt,c){const b=$('ban');b.textContent=txt;b.style.color=c;b.style.textShadow='0 0 30px '+c;b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
function point(w,msg){if(st!=='play')return;st='dead';sc[w]++;$('s0').textContent=sc[0];$('s1').textContent=sc[1];
 banner(msg||(w?'BOT SCORES':'POINT!'),w?'#ff2d8f':'#00e5ff');beep(w?160:880,.35,'sawtooth',.06);burst(ball.p,w?PK:CY,50);shake=.06;$('hint').textContent='';const g=gen;
 if(Math.max(sc[0],sc[1])>=7&&Math.abs(sc[0]-sc[1])>=2)return setTimeout(()=>{if(g===gen)endGame()},1600);
 server=((sc[0]+sc[1])>>1)&1;setTimeout(()=>{if(g===gen)beginServe()},1700)}
function beginServe(){st='serveWait';hitter=-1;ball.v.set(0,0,0);aiWait=0;
 if(server===0)$('hint').textContent='CLICK / TAP TO SERVE';else{const g=gen;$('hint').textContent='BOT SERVES';setTimeout(()=>{if(g===gen&&st==='serveWait')serve(1)},1100)}}
function serve(w){const s=w?-1:1;ball.p.set(w?(Math.random()-.5)*.6:clamp(pl.x,-.5,.5),TH+.4,s*1.3);ball.v.set(w?(Math.random()-.5)*.4:clamp(-pl.x*.4,-.4,.4),0,-s*3);
 hitter=w;serving=true;own=opp=0;st='play';swing[w]=1;beep(500,.06,'square');$('hint').textContent=''}
function endGame(){st='menu';const w=sc[0]>sc[1];$('menu').querySelector('h2').innerHTML=w?'YOU <i>WIN</i>':'BOT <i>WINS</i>';$('go').textContent='PLAY AGAIN';$('menu').classList.add('on');$('hint').textContent=''}
function startGame(){gen++;sc=[0,0];$('s0').textContent=$('s1').textContent=0;server=0;$('menu').classList.remove('on');beep(660,.1);beginServe()}
function aiUpdate(dt){let tx=0,ty=TH+.35;
 if(st==='play'&&hitter===0&&ball.v.z<0){if(aiWait>0)aiWait-=dt;else{const q=predict(-PZ);if(q){tx=q.x+aiErr;ty=Math.max(q.y,TH+.02)}else{tx=ai.x;ty=ai.y}}}
 const m=[2.6,3.8,4.6][diff]*dt;ai.x+=clamp(tx-ai.x,-m,m);ai.y+=clamp(ty-ai.y,-m,m);ai.x=clamp(ai.x,-1.1,1.1)}
const camP=new V(0,2,4),camL=new V(0,TH,0);
function camUpdate(dt){let p,l;
 if(st==='menu'){p=new V(Math.sin(t*.25)*4.6,2.2,Math.cos(t*.25)*4.6);l=new V(0,.85,0)}
 else if(camMode){p=new V(0,1.5,2.4);l=new V(0,1.0,-.5)}else{p=new V(1.5,2.3,4.1);l=new V(-.1,TH+.1,0)}
 const k=1-Math.exp(-4*dt);camP.lerp(p,k);camL.lerp(l,k);shake*=Math.exp(-7*dt);camera.position.copy(camP).add(new V((Math.random()-.5)*shake,(Math.random()-.5)*shake,(Math.random()-.5)*shake));camera.lookAt(camL)}
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.033);t+=dt;
 if(camMode)tgt.set(clamp(mouse.x*.75,-.75,.75),TH+.2+clamp((mouse.y+1)/2,0,1)*.7,PZ);else{ray.setFromCamera(mouse,camera);const hp=new V();if(ray.ray.intersectPlane(plane,hp))tgt.set(clamp(hp.x,-1,1),clamp(hp.y,TH-.05,TH+1),PZ)}
 const old=pl.clone();pl.lerp(tgt,1-Math.exp(-30*dt));pv.lerp(pl.clone().sub(old).divideScalar(Math.max(dt,.001)),.4);
 if(st==='play'||st==='dead'){for(let i=0;i<4;i++){const pz=ball.p.z;step(ball,dt/4,true);tryHit(pz)}}
 else if(st==='serveWait'&&server===0){ball.p.set(clamp(pl.x,-.5,.5),TH+.4+Math.sin(t*5)*.015,1.3)}
 else if(st==='serveWait'){ball.p.set(0,TH+.4,-1.3)}
 aiUpdate(dt);
 const vis=st!=='menu';ballM.visible=glow.visible=vis;ballM.position.copy(ball.p);glow.position.copy(ball.p);
 trail.unshift(ball.p.clone());if(trail.length>14)trail.pop();trailS.forEach((s,i)=>{s.visible=vis&&st!=='serveWait';if(trail[i])s.position.copy(trail[i])});
 swing[0]*=Math.exp(-9*dt);swing[1]*=Math.exp(-9*dt);
 pose(rb[0],pl.x*.6,2.1,pl,swing[0]);rb[0].g.visible=!camMode;pose(rb[1],ai.x*.6,-2.1,ai,swing[1]);
 for(let i=0;i<NP;i++){if(plf[i]>0){plf[i]-=dt*1.5;pvv[i*3+1]-=7*dt;for(let j=0;j<3;j++)pp[i*3+j]+=pvv[i*3+j]*dt;pc[i*3]*=.985;pc[i*3+1]*=.985;pc[i*3+2]*=.985}else pp[i*3+1]=-50}
 pg.attributes.position.needsUpdate=pg.attributes.color.needsUpdate=true;
 rip.forEach(m=>{if(m.userData.l>0){m.userData.l-=dt*2.4;const s=.03+(1-m.userData.l)*.25;m.scale.set(s,s,s);m.material.opacity=Math.max(0,m.userData.l)*.9}else m.material.opacity=0});
 {const a=dustG.attributes.position.array;for(let i=0;i<a.length;i+=3){a[i+1]+=dt*.12;if(a[i+1]>5)a[i+1]=0}dustG.attributes.position.needsUpdate=true}
 rings.forEach((m,i)=>{m.rotation.z=t*(.2+i*.1)*(i%2?1:-1);m.rotation.y=Math.sin(t*.3+i)*.3});
 camUpdate(dt);comp?comp.render():renderer.render(scene,camera)}
/* ---------- input ---------- */
addEventListener('pointermove',e=>{mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1)});
addEventListener('pointerdown',e=>{mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);if(st==='serveWait'&&server===0&&!e.target.closest('button'))serve(0)});
addEventListener('keydown',e=>{if(e.key==='c'||e.key==='C')camMode^=1;if(e.code==='Space'&&st==='serveWait'&&server===0)serve(0)});
$('cam').onclick=()=>{camMode^=1};
$('go').onclick=()=>{$('menu').querySelector('h2').innerHTML='ROBOT <i>PONGS</i>';startGame()};
document.querySelectorAll('#diffs button').forEach(b=>b.onclick=()=>{diff=+b.dataset.d;document.querySelectorAll('#diffs button').forEach(x=>x.classList.toggle('sel',x===b))});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);comp&&comp.setSize(innerWidth,innerHeight)});
frame();
</script></body></html>
